<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>独立便笺</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="memo-window">
    <header>
      <strong>置顶便笺</strong><span role="status" id="memo-status">正在打开</span
      ><button id="memo-remove" disabled>删除…</button>
    </header>
    <textarea id="memo-text" aria-label="便笺正文" placeholder="写下提纲或随手记…" disabled></textarea>
    <dialog id="memo-confirm">
      <h2>删除这张便笺？</h2>
      <p>删除后无法恢复。</p>
      <form method="dialog">
        <button value="cancel" autofocus>取消</button
        ><button value="delete" class="danger">删除便笺</button>
      </form>
    </dialog>
    <script type="module" src="memo.js"></script>
  </body>
</html>
