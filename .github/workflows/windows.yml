name: Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Install Rust components
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: cargo fmt --check
      - run: npm run build
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Assemble portable distribution
        run: ./scripts/distribution.ps1
      - name: Keep the trusted main build for release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: QuanY-windows-x64
          path: |
            release/QuanY-*-windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
